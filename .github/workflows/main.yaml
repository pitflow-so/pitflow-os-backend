name: Pitflow Full Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # JOB 1: FETCH SECRETS DO AWS SECRETS MANAGER
  # -------------------------------------------------------------------------
  fetch-secrets:
    name: Fetch Secrets from AWS Secrets Manager
    runs-on: ubuntu-latest
    outputs:
      ecr_url: ${{ steps['fetch-infra'].outputs.ecr_url }}
      eks_cluster_name: ${{ steps['fetch-infra'].outputs.eks_cluster_name }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch Infrastructure Secrets
        id: fetch-infra
        run: |
          set -eo pipefail
          echo "🔐 Buscando secret 'pitflow/bootstrap'..."
          
          INFRA_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "pitflow/bootstrap" \
            --query SecretString \
            --output text) || {
              echo "❌ Falha ao buscar secret 'pitflow/bootstrap'. Verifique se o secret existe e se as credenciais têm permissão."
              exit 1
            }
          
          ECR_URL=$(echo "$INFRA_JSON"          | jq -r '.ECR_URL')
          EKS_CLUSTER_NAME=$(echo "$INFRA_JSON" | jq -r '.EKS_CLUSTER_NAME')
          
          # Validação
          if [ -z "$ECR_URL" ] || [ "$ECR_URL" = "null" ]; then
            echo "❌ ECR_URL não encontrada"
            exit 1
          fi
        
          if [ -z "$EKS_CLUSTER_NAME" ] || [ "$EKS_CLUSTER_NAME" = "null" ]; then
            echo "❌ EKS_CLUSTER_NAME não encontrada"
            exit 1
          fi
          
          echo "ecr_url=${ECR_URL}" >> $GITHUB_OUTPUT
          echo "eks_cluster_name=${EKS_CLUSTER_NAME}" >> $GITHUB_OUTPUT
          
          echo "✅ Secret de infraestrutura obtido e mascarado com sucesso."

  # -------------------------------------------------------------------------
  # JOB 2: BUILD E PUSH DA IMAGEM
  # -------------------------------------------------------------------------
  build:
    name: Build and Push Image
    needs: [fetch-secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn -B clean verify

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Image
        env:
          ECR_URL: ${{ needs['fetch-secrets'].outputs.ecr_url }}
        run: |
          set -eo pipefail

          # Se vazio, tenta usar o valor direto
          if [ -z "${ECR_URL}" ]; then
            echo "❌ ECR_URL vazia no env, tentando usar direto..."
            DIRECT_URL="${{ needs['fetch-secrets'].outputs.ecr_url }}"
            echo "DIRECT_URL: '${DIRECT_URL}'"
            export ECR_URL="${DIRECT_URL}"
          fi

          if [ -z "${ECR_URL}" ] || [ "${ECR_URL}" = "null" ]; then
            echo "ECR_URL from env: '${ECR_URL}'"
            echo "❌ ECR_URL ainda está vazia ou inválida"
            exit 1
          fi

          IMAGE_TAG="${{ github.sha }}"
          echo "🏗️ Construindo imagem: ${ECR_URL}:${IMAGE_TAG}"

          docker build -t "${ECR_URL}:${IMAGE_TAG}" -t "${ECR_URL}:latest" .
          docker push "${ECR_URL}:${IMAGE_TAG}"
          docker push "${ECR_URL}:latest"

          echo "✅ Imagem publicada com sucesso"

  # -------------------------------------------------------------------------
  # JOB 3: DEPLOY (Configuração e Atualização do EKS)
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to Kubernetes
    needs: [fetch-secrets, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Update Kubeconfig (EKS)
        run: aws eks update-kubeconfig --name ${{ needs['fetch-secrets'].outputs.eks_cluster_name }} --region us-east-1

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch Application Secrets
        run: |
          set -eo pipefail

          echo "🔐 Buscando secret 'pitflow/bootstrap'..."
          
          APP_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "pitflow/bootstrap" \
            --query SecretString \
            --output text) || {
              echo "❌ Falha ao buscar secret 'pitflow/bootstrap'. Verifique se o secret existe e se as credenciais têm permissão."
              exit 1
            }
          
          DB_PASSWORD=$(echo "$APP_JSON"    | jq -r '.DB_PASSWORD')
          DB_USERNAME=$(echo "$APP_JSON"    | jq -r '.DB_USERNAME')
          DB_NAME=$(echo "$APP_JSON"        | jq -r '.DB_NAME')
          DB_HOST=$(echo "$APP_JSON"        | jq -r '.DB_HOST')
          DB_PORT=$(echo "$APP_JSON"        | jq -r '.DB_PORT')
          JWT_SECRET=$(echo "$APP_JSON"     | jq -r '.JWT_SECRET')
          MOCK_MESSAGE=$(echo "$APP_JSON"   | jq -r '.MOCK_MESSAGE')
          MAIL_USERNAME=$(echo "$APP_JSON"  | jq -r '.MAIL_USERNAME')
          MAIL_PASSWORD=$(echo "$APP_JSON"  | jq -r '.MAIL_PASSWORD')
          
          for VAR_NAME in DB_PASSWORD DB_USERNAME DB_NAME DB_HOST DB_PORT JWT_SECRET MOCK_MESSAGE MAIL_USERNAME MAIL_PASSWORD; do
            VAL="${!VAR_NAME}"
            if [ -z "$VAL" ] || [ "$VAL" = "null" ]; then
              echo "❌ Chave '$VAR_NAME' não encontrada ou vazia em 'pitflow/bootstrap'."
              exit 1
            fi
            echo "::add-mask::$VAL"
          done
          
          echo "DB_PASSWORD=$DB_PASSWORD"   >> $GITHUB_ENV
          echo "DB_USERNAME=$DB_USERNAME"   >> $GITHUB_ENV
          echo "DB_NAME=$DB_NAME"           >> $GITHUB_ENV
          echo "DB_HOST=$DB_HOST"           >> $GITHUB_ENV
          echo "DB_PORT=$DB_PORT"           >> $GITHUB_ENV
          echo "JWT_SECRET=$JWT_SECRET"     >> $GITHUB_ENV
          echo "MOCK_MESSAGE=$MOCK_MESSAGE" >> $GITHUB_ENV
          echo "MAIL_USERNAME=$MAIL_USERNAME" >> $GITHUB_ENV
          echo "MAIL_PASSWORD=$MAIL_PASSWORD" >> $GITHUB_ENV
          
          # Lê API_PUBLIC_URL do Secret Manager (vazia no primeiro deploy)
          API_PUBLIC_URL=$(echo "$APP_JSON" | jq -r '.API_PUBLIC_URL // empty')
          
          API_PUBLIC_URL="${API_PUBLIC_URL:-http://pending-first-deploy}"
          echo "API_PUBLIC_URL=$API_PUBLIC_URL" >> $GITHUB_ENV

      - name: Deploy Application Manifests
        env:
          CONTAINER_IMAGE: ${{ needs['fetch-secrets'].outputs.ecr_url }}:${{ github.sha }}
          DB_PASSWORD:     ${{ env.DB_PASSWORD }}
          DB_USERNAME:     ${{ env.DB_USERNAME }}
          DB_NAME:         ${{ env.DB_NAME }}
          DB_HOST:         ${{ env.DB_HOST }}
          DB_PORT:         ${{ env.DB_PORT }}
          JWT_SECRET:      ${{ env.JWT_SECRET }}
          MOCK_MESSAGE:    ${{ env.MOCK_MESSAGE }}
          MAIL_USERNAME:   ${{ env.MAIL_USERNAME }}
          MAIL_PASSWORD:   ${{ env.MAIL_PASSWORD }}
          API_PUBLIC_URL:  ${{ env.API_PUBLIC_URL }}
        run: |
          set -eo pipefail
          # 1. Aplica Secrets
          envsubst < infra/k8s/secrets.yaml | kubectl apply -f -

          # 2. Aplica Service
          kubectl apply -f infra/k8s/service.yaml

          # 3. Cria ConfigMap com a URL
          export API_PUBLIC_URL
          echo "Criando ConfigMap com API_PUBLIC_URL=$API_PUBLIC_URL"
          envsubst < infra/k8s/configmap.yaml | kubectl apply -f -

          # 4. Aplica Deployment
          echo "Aplicando Deployment com ConfigMap pronto..."
          envsubst < infra/k8s/deployment.yaml | kubectl apply -f -

          # 5. Aguarda Deployment ficar pronto
          kubectl rollout status deployment/pitflow-backend --timeout=300s || {
            kubectl rollout undo deployment/pitflow-backend
            exit 1
          }

          # 6. Apply HPA
          kubectl apply -f infra/k8s/hpa.yaml

      - name: Update Secret Manager with LB_URL
        run: |
          set -eo pipefail

          # 1. Aguarda e captura o DNS do LoadBalancer
          echo "Aguardando DNS do LoadBalancer..."
          ATTEMPTS=0
          MAX_ATTEMPTS=30
          LB_URL=""

          while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            LB_URL=$(kubectl get service pitflow-service \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            if [ -n "$LB_URL" ]; then
              echo "✅ LoadBalancer DNS obtido: $LB_URL"
              break
            fi

            echo "⏳ Tentativa $((ATTEMPTS+1))/$MAX_ATTEMPTS - Aguardando LoadBalancer..."
            sleep 10
            ATTEMPTS=$((ATTEMPTS+1))
          done

          if [ -z "$LB_URL" ]; then
            echo "❌ Erro: LoadBalancer não gerou DNS a tempo"
            exit 1
          fi

          # 2. Atualiza o Secret Manager
          SECRET_ID="pitflow/bootstrap"

          CURRENT_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" \
            --query 'SecretString' \
            --output text)

          UPDATED_SECRET=$(echo "$CURRENT_SECRET" | \
            jq --arg LB_URL "$LB_URL" \
               '.LB_URL = $LB_URL')   # ← bug corrigido aqui

          aws secretsmanager update-secret \
            --secret-id "$SECRET_ID" \
            --secret-string "$UPDATED_SECRET" > /dev/null

          echo "✅ Secrets Manager atualizado com sucesso"
