name: Pitflow Full Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Habilitar execução manual

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # JOB 1: INFRAESTRUTURA AWS
  # -------------------------------------------------------------------------
  infrastructure:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    outputs:
      rds_endpoint: ${{ steps.tf-output.outputs.rds_endpoint }}
      ecr_url: ${{ steps.tf-output.outputs.ecr_url }}
      eks_cluster_name: ${{ steps.tf-output.outputs.eks_cluster_name }}
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Bootstrap S3 for TF State
        run: |
          if ! aws s3api head-bucket --bucket tfstate-backend-fiap-pitflow 2>/dev/null; then
            aws s3 mb s3://tfstate-backend-fiap-pitflow --region us-east-1
          else
            echo "Bucket já existe nesta conta, continuando..."
          fi

      - name: Cache Terraform
        uses: actions/cache@v4
        with:
          path: infra/terraform/.terraform
          key: terraform-${{ hashFiles('infra/terraform/.terraform.lock.hcl') }}

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: cd infra/terraform && terraform init

      - name: Terraform Validate
        run: cd infra/terraform && terraform validate

      - name: Terraform Plan
        run: |
          cd infra/terraform
          terraform plan -var="db_password=${{ secrets.DB_PASSWORD }}" -out=main.tfplan

      - name: Terraform Apply
        run: |
          cd infra/terraform
          terraform apply -auto-approve main.tfplan

      - name: Capture Outputs
        id: tf-output
        run: |
          cd infra/terraform
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT

  # -------------------------------------------------------------------------
  # JOB 2: BUILD E TESTES
  # -------------------------------------------------------------------------
  build:
    name: Build and Push Image
    needs: infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean package

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Image
        run: |
          ECR_URL=${{ needs.infrastructure.outputs.ecr_url }}
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ECR_URL:$IMAGE_TAG -t $ECR_URL:latest .
          docker push $ECR_URL:$IMAGE_TAG
          docker push $ECR_URL:latest

  # -------------------------------------------------------------------------
  # JOB 3: DEPLOY (Configuração e Atualização do EKS)
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to Kubernetes
    needs: [infrastructure, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Update Kubeconfig (EKS)
        run: aws eks update-kubeconfig --name ${{ needs.infrastructure.outputs.eks_cluster_name }} --region us-east-1

      - name: Install Metrics Server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl rollout status deployment/metrics-server -n kube-system --timeout=120s

      - name: Deploy Application Manifests
        env:
          RDS_ENDPOINT: ${{ needs.infrastructure.outputs.rds_endpoint }}
          CONTAINER_IMAGE: ${{ needs.infrastructure.outputs.ecr_url }}:${{ github.sha }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MOCK_MESSAGE: ${{ secrets.MOCK_MESSAGE }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          # 1. Aplica Secrets.
          envsubst < infra/k8s/secrets.yaml | kubectl apply -f -
          
          # 2. Aplica Service
          kubectl apply -f infra/k8s/service.yaml
          
          # 3. Aguarda e captura o DNS do LoadBalancer
          echo "Aguardando DNS do LoadBalancer..."
          ATTEMPTS=0
          MAX_ATTEMPTS=30
          while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            API_URL=$(kubectl get service pitflow-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$API_URL" ] && [ "$API_URL" != "<pending>" ]; then
              echo "✅ LoadBalancer DNS obtido: $API_URL"
              API_PUBLIC_URL="http://$API_URL"
              break
            fi
            echo "⏳ Tentativa $((ATTEMPTS+1))/$MAX_ATTEMPTS - Aguardando LoadBalancer..."
            sleep 10
            ATTEMPTS=$((ATTEMPTS+1))
          done
          
          if [ -z "$API_URL" ] || [ "$API_URL" = "<pending>" ]; then
            echo "❌ Erro: LoadBalancer não gerou DNS a tempo"
            exit 1
          fi
          
          # 4. Cria ConfigMap com a URL 
          export API_PUBLIC_URL
          echo "Criando ConfigMap com API_URL=$API_PUBLIC_URL"
          envsubst < infra/k8s/configmap.yaml | kubectl apply -f -
          
          # 5. Aplica deployment
          echo "Aplicando Deployment com ConfigMap pronto..."
          envsubst < infra/k8s/deployment.yaml | kubectl apply -f -
          
          # 6. Aguarda Deployment ficar pronto
          kubectl rollout status deployment/pitflow-backend --timeout=300s
          
          # 7. Apply HPA (por último, baseado no Deployment funcionando)
          kubectl apply -f infra/k8s/hpa.yaml  

      - name: Verify Final Deployment
        run: |
          echo "✅ Deployment final verificado:"
          kubectl get pods
          kubectl get svc pitflow-service
          kubectl get hpa

      - name: Get API Endpoint URL
        id: get-api-url
        run: |
            API_URL=$(kubectl get service pitflow-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$API_URL" ]; then
              echo "api_endpoint=http://$API_URL" >> $GITHUB_OUTPUT
              echo "✅ API disponível em: http://$API_URL"
            else
              echo "⚠️ LoadBalancer ainda pendente, verifique manualmente"
            fi
