spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop  # JPA cria e destrói as tabelas nos testes
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: false  # Desabilita Liquibase nos testes

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:pitflow.notifications@gmail.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

api:
  security:
    token:
      secret: test-secret-key-para-testes-apenas-nao-usar-em-producao-123456789
      expiration-hours: 3
  url: http://localhost:8080

services:
  registry:
    base-url: http://localhost:8081
  inventory:
    base-url: http://localhost:8082

mock:
  send-message: true

management:
  datadog:
    metrics:
      export:
        enabled: false
