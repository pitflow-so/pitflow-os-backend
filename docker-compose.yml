services:
  db:
    image: postgres:16-alpine
    container_name: pitflow-postgres
    environment:
      POSTGRES_DB: pitflow_os
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pitflow_os"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: