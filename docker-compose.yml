services:
  db:
    image: postgres:16-alpine
    container_name: pitflow-db
    environment:
      POSTGRES_DB: pitflow_os
      POSTGRES_USER: ${DB_USERNAME:postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-admin} -d pitflow_os"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: