apiVersion: v1
kind: ConfigMap
metadata:
  name: pitflow-backend-config
  namespace: pitflow
  labels:
    app.kubernetes.io/name: pitflow-backend
    app.kubernetes.io/instance: pitflow-backend
    app.kubernetes.io/component: operation
    app.kubernetes.io/part-of: pitflow
    app.kubernetes.io/managed-by: github-actions
data:
  DB_HOST: "${DB_HOST}"
  DB_PORT: "${DB_PORT}"
  DB_NAME: "${DB_NAME}"
  DB_USERNAME: "${DB_USERNAME}"
  API_PUBLIC_URL: "${API_PUBLIC_URL}"
  MOCK_MESSAGE: "${MOCK_MESSAGE}"
  REGISTRY_SERVICE_URL: "http://pitflow-registry"
